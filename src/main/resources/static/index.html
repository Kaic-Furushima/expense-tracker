<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2f7d6d">
    <meta name="color-scheme" content="light dark">
    <title>Expense Tracker</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/app.css">
    <script>
        // Apply the saved theme before first paint to avoid a light flash in dark mode.
        try {
            var t = localStorage.getItem('theme');
            if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        } catch (e) {}
    </script>
</head>
<body>
<div class="app">
    <nav class="nav" aria-label="Navegação principal">
        <div class="brand"><span class="brand-mark" data-ico="wallet"></span><span class="brand-name">Expense Tracker</span></div>
        <button class="nav-item" data-tab="home"><span class="ico" data-ico="home"></span><span>Início</span></button>
        <button class="nav-item" data-tab="transactions"><span class="ico" data-ico="receipt"></span><span>Lançamentos</span></button>
        <button class="nav-item" data-tab="budgets"><span class="ico" data-ico="target"></span><span>Orçamentos</span></button>
        <button class="nav-item" data-tab="goals"><span class="ico" data-ico="coins"></span><span>Metas</span></button>
        <button class="nav-item" data-tab="more"><span class="ico" data-ico="settings"></span><span>Mais</span></button>
    </nav>

    <main class="main">
        <header class="topbar">
            <div class="month-switch">
                <button id="prev-month" class="icon-btn" aria-label="Mês anterior">‹</button>
                <button id="month-label" class="month-label" aria-label="Voltar para o mês atual"></button>
                <button id="next-month" class="icon-btn" aria-label="Próximo mês">›</button>
            </div>
            <div class="topbar-right">
                <button id="profile-btn" class="profile-btn" aria-label="Trocar de perfil" hidden></button>
                <button id="bell-btn" class="icon-btn bell" aria-label="Lembretes" hidden></button>
                <button id="account-btn" class="account-btn" aria-label="Escolher conta"></button>
                <button id="theme-btn" class="icon-btn" aria-label="Alternar tema"></button>
            </div>
        </header>
        <div id="offline-bar" class="notice" role="status" hidden></div>
        <div id="busy" class="busy" role="status" aria-live="polite" hidden><span>Aguarde…</span></div>
        <div id="view" class="view" aria-live="polite"></div>
    </main>

    <button id="fab" class="fab" aria-label="Novo lançamento" data-ico="plus"></button>
</div>

<div id="sheet-root"></div>
<div id="confirm-root"></div>
<div id="toast" class="toast" role="status"></div>

<script src="/js/lang.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/icons.js"></script>
<script src="/js/select.js"></script>
<script src="/js/app.js"></script>
<script src="/js/features.js"></script>
<script src="/js/tools.js"></script>
<script src="/js/extras.js"></script>
<script src="/js/profiles.js"></script>
</body>
</html>
