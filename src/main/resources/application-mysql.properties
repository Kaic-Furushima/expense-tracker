# Uso: java -jar app.jar --spring.profiles.active=mysql
# Credenciais via variaveis de ambiente (nada de senha no repositorio).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# As migracoes do Flyway (db/migration) sao escritas para o H2. No MySQL o esquema continua sendo
# mantido pelo Hibernate.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
