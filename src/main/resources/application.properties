spring.application.name=Pocketful

# Sincronizacao com o celular. Servidor padrao (um projeto Supabase seu, opcional): preencha os dois e a tela de
# sincronizacao passa a oferecer "Servidor padrao". Vazio = cada pessoa usa o seu proprio projeto. A chave "anon" e publica.
sync.hub.url=
sync.hub.anon-key=

# Porta do servidor. Por padrao so o proprio computador acessa (127.0.0.1). Para o celular na mesma rede Wi-Fi,
# inicie com "run.bat celular" (ou run-jar.bat celular): ele escuta em todas as interfaces e o log mostra o endereco.
server.port=8080
server.address=${app.bind-address:127.0.0.1}

# Banco local (H2 em arquivo). O H2 e o unico banco suportado.
spring.datasource.url=jdbc:h2:file:${app.data-dir:./data}/expenses;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# O esquema e versionado pelo Flyway (src/main/resources/db/migration). Bancos criados antes do Flyway
# sao marcados como versao 1 e recebem so as migracoes novas. O Hibernate apenas confere o resultado.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Nunca executar scripts SQL automaticamente (os dados de exemplo sao carregados pela interface)
spring.sql.init.mode=never

# Abre o navegador ao iniciar (run.bat).
app.open-browser=true

# Modo janela propria (Edge/Chrome em --app). O executavel do jpackage liga isso com -Dapp.window-mode=true.
app.window-mode=false
# Motor da janela: "webview" (JavaFX, embutido) ou "edge" (Edge/Chrome em --app).
app.window-engine=webview

# Fuso do "hoje" (lancamentos, vencimentos, fechamento do mes). Vazio = fuso deste computador.
#app.zone=America/Sao_Paulo
